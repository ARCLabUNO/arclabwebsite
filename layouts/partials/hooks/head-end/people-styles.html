<style>

/* =========================================================
   ARC LAB — PEOPLE PAGE
   Styling the native Hugo Blox People block
========================================================= */


/* ---------------------------------------------------------
   PEOPLE PAGE CONTAINER
--------------------------------------------------------- */

.people-widget {
  position: relative;

  max-width: 1200px;

  margin-left: auto;
  margin-right: auto;

  padding:
    0.5rem 0 3rem;
}


/* ---------------------------------------------------------
   PAGE / SECTION HEADING
--------------------------------------------------------- */

.people-widget .section-heading {
  margin-bottom: 2.5rem;
}

.people-widget .section-heading h1 {
  color: #f1f5f9;

  font-size: 2.4rem;

  font-weight: 800;

  line-height: 1.15;

  margin-bottom: 0.65rem;
}


/* ---------------------------------------------------------
   GROUP HEADINGS
   Directors / Research Scientists / Grad Students / Alumni
--------------------------------------------------------- */

.people-widget > .col-md-12:not(.section-heading) {
  margin-top: 2.5rem;

  margin-bottom: 1rem;
}

.people-widget > .col-md-12:not(.section-heading) h2 {
  display: inline-flex;

  align-items: center;

  margin: 0;

  padding:
    0.45rem 0.8rem;

  color: #5eead4;

  background:
    rgba(45, 212, 191, 0.10);

  border:
    1px solid rgba(45, 212, 191, 0.42);

  border-radius: 999px;

  font-size: 0.82rem;

  font-weight: 800;

  line-height: 1.1;

  letter-spacing: 0.07em;

  text-transform: uppercase;
}


/* ---------------------------------------------------------
   PERSON GRID
--------------------------------------------------------- */

.people-widget .people-person {
  position: relative;

  display: flex;

  flex-direction: column;

  align-items: center;

  justify-content: flex-start;

  width: 270px;

  max-width: 270px;

  margin:
    0 0.8rem 2rem;

  padding:
    1.35rem 1.2rem 1.4rem;

  background:
    linear-gradient(
      145deg,
      #1a2940 0%,
      #0f1622 100%
    );

  border:
    1px solid #33465f;

  border-radius:
    14px;

  box-shadow:
    0 8px 24px rgba(0, 0, 0, 0.18);

  overflow:
    hidden;

  transition:
    transform 0.2s ease,
    border-color 0.2s ease,
    box-shadow 0.2s ease;
}


/* ---------------------------------------------------------
   BLUE → TEAL ACCENT
--------------------------------------------------------- */

.people-widget .people-person::before {
  content: "";

  position: absolute;

  top: 0;
  left: 0;
  right: 0;

  height: 4px;

  background:
    linear-gradient(
      90deg,
      #3b82f6 0%,
      #2dd4bf 100%
    );
}


/* ---------------------------------------------------------
   CARD HOVER
--------------------------------------------------------- */

.people-widget .people-person:hover {
  transform:
    translateY(-5px);

  border-color:
    #526b89;

  box-shadow:
    0 14px 32px rgba(0, 0, 0, 0.28);
}


/* ---------------------------------------------------------
   AVATAR
--------------------------------------------------------- */

.people-widget .people-person .avatar {
  display: block;

  width: 175px;
  height: 175px;

  margin:
    0.3rem auto 1.1rem;

  object-fit: cover;

  border:
    4px solid #33465f;

  box-shadow:
    0 0 0 4px rgba(45, 212, 191, 0.08),
    0 8px 18px rgba(0, 0, 0, 0.22);

  transition:
    transform 0.2s ease,
    border-color 0.2s ease,
    box-shadow 0.2s ease;
}


/* Avatar hover */

.people-widget
.people-person:hover
.avatar {
  transform:
    scale(1.025);

  border-color:
    #2dd4bf;

  box-shadow:
    0 0 0 4px rgba(45, 212, 191, 0.13),
    0 10px 22px rgba(0, 0, 0, 0.26);
}


/* ---------------------------------------------------------
   PERSON TEXT
--------------------------------------------------------- */

.people-widget .portrait-title {
  width: 100%;

  text-align: center;
}


/* Name */

.people-widget .portrait-title h2 {
  margin:
    0 0 0.35rem;

  color:
    #f1f5f9;

  font-size:
    1.25rem;

  font-weight:
    800;

  line-height:
    1.25;
}


/* Name link */

.people-widget .portrait-title h2 a {
  color:
    inherit;

  text-decoration:
    none !important;
}

.people-widget .portrait-title h2 a:hover {
  color:
    #93c5fd;
}


/* ---------------------------------------------------------
   ROLE
--------------------------------------------------------- */

.people-widget .portrait-title h3 {
  margin:
    0.15rem 0 0;

  color:
    #7fc8e8;

  font-size:
    0.93rem;

  font-weight:
    600;

  line-height:
    1.45;
}


/* ---------------------------------------------------------
   SOCIAL ICONS
--------------------------------------------------------- */

.people-widget .portrait-title .network-icon {
  margin:
    0.85rem 0.2rem 0;

  color:
    #94a3b8;

  transition:
    color 0.15s ease,
    transform 0.15s ease;
}

.people-widget .portrait-title .network-icon:hover {
  color:
    #2dd4bf;

  transform:
    translateY(-1px);
}


/* ---------------------------------------------------------
   REMOVE GENERIC LINK UNDERLINES
--------------------------------------------------------- */

.people-widget a,
.people-widget a:hover,
.people-widget a:focus,
.people-widget a:active {
  text-decoration:
    none !important;
}


/* ---------------------------------------------------------
   RESPONSIVE — TABLET
--------------------------------------------------------- */

@media (max-width: 1100px) {

  .people-widget {
    padding-left:
      0.5rem;

    padding-right:
      0.5rem;
  }

  .people-widget .people-person {
    width:
      240px;

    max-width:
      240px;
  }

  .people-widget .people-person .avatar {
    width:
      155px;

    height:
      155px;
  }

}


/* ---------------------------------------------------------
   RESPONSIVE — MOBILE
--------------------------------------------------------- */

@media (max-width: 768px) {

  .people-widget .section-heading h1 {
    font-size:
      2rem;
  }

  .people-widget .people-person {
    width:
      min(100%, 300px);

    max-width:
      300px;

    margin-left:
      auto;

    margin-right:
      auto;
  }

  .people-widget .people-person .avatar {
    width:
      165px;

    height:
      165px;
  }

}

</style>
