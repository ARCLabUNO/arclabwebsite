<style>

/* =================================
   MODULES
================================= */

.module-container {
  max-width: 1200px;
  margin: 2rem auto;
  padding: 0 1rem;
}

.module-container > h2 {
  color: #f1f5f9;
  margin-bottom: 1.25rem;
}


/* =================================
   GRID
================================= */

.module-grid {
  display: grid;

  grid-template-columns:
    repeat(2, minmax(0, 1fr));

  gap: 2rem;

  margin-top: 2rem;

  align-items: stretch;
}


/* =================================
   CARD
================================= */

.module-card {
  position: relative;

  display: flex;
  flex-direction: column;
  justify-content: space-between;

  min-width: 0;

  background:
    linear-gradient(
      145deg,
      #1a2940 0%,
      #0f1622 100%
    );

  color: #f1f5f9;

  border: 1px solid #33465f;
  border-radius: 12px;

  padding: 2rem;

  box-shadow:
    0 8px 24px rgba(0, 0, 0, 0.18);

  overflow: hidden;

  transition:
    transform 0.2s ease,
    border-color 0.2s ease,
    box-shadow 0.2s ease;
}


/* BLUE → TEAL ARC ACCENT */

.module-card::before {
  content: "";

  position: absolute;

  top: 0;
  left: 0;
  right: 0;

  height: 4px;

  background:
    linear-gradient(
      90deg,
      #3b82f6 0%,
      #2dd4bf 100%
    );
}


.module-card:hover {
  transform: translateY(-5px);

  border-color: #526b89;

  box-shadow:
    0 14px 32px rgba(0, 0, 0, 0.28);
}


/* =================================
   BASE LABEL
================================= */

.module-label {
  display: inline-flex;

  align-items: center;

  margin-bottom: 0.85rem;

  padding: 0.38rem 0.7rem;

  font-size: 0.78rem;
  font-weight: 800;
  line-height: 1.1;

  letter-spacing: 0.05em;

  text-transform: uppercase;

  border-radius: 999px;
}


/* =================================
   LIVE MODULE
================================= */

.module-label.live {
  color: #5eead4;

  background:
    rgba(45, 212, 191, 0.12);

  border:
    1px solid rgba(45, 212, 191, 0.55);

  box-shadow:
    0 0 12px rgba(45, 212, 191, 0.06);
}


/* =================================
   IN DEVELOPMENT
================================= */

.module-label.dev {
  color: #b7c4d5;

  background:
    rgba(148, 163, 184, 0.10);

  border:
    1px solid rgba(148, 163, 184, 0.28);
}


/* =================================
   TITLE
================================= */

.module-card h3 {
  margin: 0 0 0.6rem;

  color: #f1f5f9;

  font-size: 1.3rem;
  font-weight: 800;
  line-height: 1.3;
}


/* =================================
   DESCRIPTION
================================= */

.module-card p {
  color: #c3cfdd;

  line-height: 1.6;

  margin-bottom: 1.25rem;

  font-size: 0.96rem;
}


/* =================================
   VIEW MODULE BUTTON
================================= */

.module-link {
  display: inline-flex;

  align-items: center;
  justify-content: center;

  padding: 0.62rem 0.95rem;

  background: #315f8f;

  color: #ffffff !important;

  border: 1px solid #4e7eae;
  border-radius: 5px;

  text-decoration: none !important;

  font-size: 0.9rem;
  font-weight: 800;
  line-height: 1.2;

  box-shadow:
    0 3px 8px rgba(0, 0, 0, 0.16);

  transition:
    background 0.15s ease,
    border-color 0.15s ease,
    transform 0.15s ease,
    box-shadow 0.15s ease;
}


.module-link:hover {
  background: #3d73a8;

  border-color: #69a0d2;

  color: #ffffff !important;

  text-decoration: none !important;

  transform: translateY(-1px);

  box-shadow:
    0 5px 12px rgba(0, 0, 0, 0.22);
}


/* =================================
   DISABLED BUTTON
================================= */

.module-link.disabled {
  background:
    rgba(148, 163, 184, 0.10);

  color: #9aa8bd !important;

  border:
    1px solid rgba(148, 163, 184, 0.28);

  cursor: default;

  pointer-events: none;

  box-shadow: none;

  transform: none;
}


/* =================================
   SMALL BADGE / NOTE
================================= */

.module-badge {
  margin-top: 0.5rem;

  color: #9aa8bd;

  font-size: 0.8rem;
}


/* =================================
   REMOVE LINK UNDERLINES
================================= */

.module-container a,
.module-container a:hover,
.module-container a:focus,
.module-container a:active {
  text-decoration: none !important;
}


/* =================================
   RESPONSIVE
================================= */

@media (max-width: 768px) {

  .module-grid {
    grid-template-columns: 1fr;
  }

  .module-card {
    padding: 1.5rem;
  }

}

</style>


<div class="module-container">

  <h2>
    Modules
  </h2>


  <div class="module-grid">


    <!-- =================================
         MODULE 1
    ================================= -->

    <div class="module-card">

      <div>

        <span class="module-label live">
          Module 1
        </span>

        <h3>
          Risk vs. Needs Assessments
        </h3>

        <p>
          Risk and needs assessments are related, but they answer different questions.
        </p>

      </div>


      <div>

        <a
          href="/training-modules/lessons-in-risk-application/01-risk-vs-needs/"
          class="module-link"
        >
          View Module
        </a>

      </div>

    </div>


  </div>

</div>
